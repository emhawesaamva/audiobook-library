name: CI

# Automated test pipeline.
#
# The PR-into-master run is the gate: branch protection blocks the merge — and
# therefore the Vercel auto-deploy of master — until the tests pass. Pushes to
# dev get the same fast feedback while iterating; pushes to master re-run so the
# branch tip always has a recorded status.
on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  # ---------------------------------------------------------------------------
  # End-to-end (Playwright) — written but NOT enabled.
  #
  # coverage.mjs stubs the paid APIs (Claude + Audible), so no AI keys are
  # needed. It does, however, provision a test account through Supabase, and the
  # app cannot sign in or load libraries without a live backend. There is no
  # mock backend, so this job requires two repository secrets:
  #
  #     VITE_SUPABASE_URL
  #     SUPABASE_SECRET_KEY   (service-role / secret key)
  #
  # Add them under Settings > Secrets and variables > Actions, then uncomment.
  # Note: coverage.mjs launches Chrome via channel:"chrome", so it installs the
  # real Chrome channel rather than bundled Chromium.
