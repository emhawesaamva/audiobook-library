name: CI

# Automated test pipeline.
#
# The PR-into-master run is the gate: branch protection blocks the merge — and
# therefore the Vercel auto-deploy of master — until the tests pass. Pushes to
# dev get the same fast feedback while iterating; pushes to master re-run so the
# branch tip always has a recorded status.
#
# Nightly still separately covers test:integration (RLS/auth/admin — not a UI
# concern) on a schedule, but test:mobile gates every PR now: it used to run
# nightly only, which meant a PR could merge with a mobile layout regression
# and nothing would say so until the next morning at the earliest.
on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  # End-to-end (Playwright). Runs only on PRs into master — it's slower than the
  # unit suite, so dev pushes stay fast. coverage.mjs stubs the paid APIs (Claude
  # + Audible) so no AI keys are used, and it provisions its throwaway account
  # against a local Supabase stack, so it needs no credentials at all.
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    # Both suites finish in well under 10 minutes. Without a cap a hung setup
    # step runs to the 6-hour default, which is how a flaky Chrome install
    # sat for 28 minutes looking like a slow test rather than a stuck one.
    timeout-minutes: 25
    if: github.event_name == 'pull_request'
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Ensure Chrome for Playwright
        # Both suites launch Chrome via channel:"chrome" -- the real browser, not
        # bundled Chromium. ubuntu-latest already ships Google Chrome, which is
        # exactly what that channel resolves to, so the usual install is a no-op
        # that still reaches out to apt and Google's CDN -- and that reach-out has
        # hung for tens of minutes more than once. Use what is there, install only
        # when it genuinely is not, and bound it either way.
        timeout-minutes: 8
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "using preinstalled $(google-chrome --version)"
          else
            echo "no system Chrome found — installing via Playwright"
            npx playwright install --with-deps chrome
          fi
      # The suite runs against a local Supabase stack in Docker (preinstalled on
      # GitHub runners) rather than a hosted project. A hosted test project can
      # be paused by the free-tier idle policy, which is exactly what happened:
      # the suite failed to connect, reported 0/0 steps, and exited 0 — a green
      # check that tested nothing. Local means no pausing, no project cap, no
      # shared state between runs, and no credentials in repo secrets.
      - name: Start local Supabase
        run: npx supabase start
      # Applies supabase/migrations/* in filename order onto a clean database.
      - name: Apply migrations
        run: npx supabase db reset --no-seed
      - name: Point .env at the local stack
        run: npm run db:use-local
      # Prints the real status/body for the admin-create → sign-in → insert path.
      # A PostgREST 403 in a browser console carries no detail; this does.
      - name: Diagnose local stack
        run: node scripts/diagnose-local.mjs
      - name: Start dev server and run E2E
        run: |
          npm run dev &
          npx wait-on -t 60000 http://localhost:5173
          npm run test:e2e
      - name: Supabase logs on failure
        if: failure()
        run: npx supabase status || true

  # Mobile-viewport layout audit (Playwright). Same local-Supabase setup as e2e,
  # run as an independent job (not `needs: e2e`) so the two run in parallel and
  # a slow/flaky one doesn't hold up the other.
  mobile:
    name: Mobile audit (Playwright)
    runs-on: ubuntu-latest
    # Both suites finish in well under 10 minutes. Without a cap a hung setup
    # step runs to the 6-hour default, which is how a flaky Chrome install
    # sat for 28 minutes looking like a slow test rather than a stuck one.
    timeout-minutes: 25
    if: github.event_name == 'pull_request'
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Ensure Chrome for Playwright
        # Both suites launch Chrome via channel:"chrome" -- the real browser, not
        # bundled Chromium. ubuntu-latest already ships Google Chrome, which is
        # exactly what that channel resolves to, so the usual install is a no-op
        # that still reaches out to apt and Google's CDN -- and that reach-out has
        # hung for tens of minutes more than once. Use what is there, install only
        # when it genuinely is not, and bound it either way.
        timeout-minutes: 8
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "using preinstalled $(google-chrome --version)"
          else
            echo "no system Chrome found — installing via Playwright"
            npx playwright install --with-deps chrome
          fi
      - name: Start local Supabase
        run: npx supabase start
      - name: Apply migrations
        run: npx supabase db reset --no-seed
      - name: Point .env at the local stack
        run: npm run db:use-local
      - name: Start dev server and run mobile audit
        run: |
          npm run dev &
          npx wait-on -t 60000 http://localhost:5173
          npm run test:mobile
      - name: Upload mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-audit-shots
          path: scripts/ui-test/mobile-shots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Supabase logs on failure
        if: failure()
        run: npx supabase status || true
